steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'frontend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          -t us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/resume-analyzer-frontend:$_COMMIT_SHA \
          -t us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/resume-analyzer-frontend:latest \
          --build-arg NEXT_PUBLIC_API_URL=$_NEXT_PUBLIC_API_URL \
          .

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'frontend'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/resume-analyzer-frontend'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    dir: 'frontend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'resume-analyzer-frontend'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/resume-analyzer-frontend:$_COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--set-env-vars=NEXTAUTH_URL=https://resume-analyzer-frontend-87294979859.us-central1.run.app'
      - '--set-secrets=NEXTAUTH_SECRET=NEXTAUTH_SECRET:latest'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/resume-analyzer-frontend:latest'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _COMMIT_SHA: latest
  _NEXT_PUBLIC_API_URL: https://resume-analyzer-backend-87294979859.us-central1.run.app/api/v1
